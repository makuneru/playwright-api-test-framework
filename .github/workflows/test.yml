name: API Tests

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: 
      name: ${{ github.ref == 'refs/heads/master' && 'production' || 'development' }}
    
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Debug environment variables
        env:
          API_KEY: ${{ secrets.API_KEY }}
          BASE_URL: ${{ vars.BASE_URL || 'https://reqres.in' }}
          AUTH_TYPE: ${{ vars.AUTH_TYPE || 'API_KEY' }}
          TEST_ENV: ${{ vars.TEST_ENV || 'CI' }}
          PROFILE: ${{ vars.PROFILE || 'default' }}
        run: |
          echo "BASE_URL: $BASE_URL"
          echo "AUTH_TYPE: $AUTH_TYPE"
          echo "TEST_ENV: $TEST_ENV"
          echo "PROFILE: $PROFILE"
          echo "API_KEY is set: $([ -n "$API_KEY" ] && echo 'yes' || echo 'no')"
          echo "API_KEY length: ${#API_KEY}"

      - name: Run Playwright tests
        env:
          API_KEY: ${{ secrets.API_KEY }}
          BASE_URL: ${{ vars.BASE_URL || 'https://reqres.in' }}
          AUTH_TYPE: ${{ vars.AUTH_TYPE || 'API_KEY' }}
          TEST_ENV: ${{ vars.TEST_ENV || 'CI' }}
          PROFILE: ${{ vars.PROFILE || 'default' }}
          CI: true
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/report/
          retention-days: 30

      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: playwright/report/results.xml
          retention-days: 30

      - name: Upload test results (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: json-results
          path: playwright/report/results.json
          retention-days: 30

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: playwright/report/results.xml
          check_name: Playwright Test Results
          comment_mode: create new
          report_individual_runs: true

